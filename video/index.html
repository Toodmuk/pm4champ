<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>True CyberSafe PRO — Demo Video Timeline (TH)</title>
<style>
@font-face{
  font-family:"Noto Sans Thai";
  src:url("fonts/NotoSansThai.ttf") format("truetype");
  font-weight:100 900;
}
@font-face{
  font-family:"Noto Sans";
  src:url("fonts/NotoSans.ttf") format("truetype");
  font-weight:100 900;
}
:root{
  --red:#FF0000;
  --magenta:#E5007D;
  --blue:#2E6FD9;
  --ink:#141416;
  --rule:#E2E2E8;
  --panel:#F5F5F8;
  --safe:#12A150;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{
  font-family:"Noto Sans Thai","Noto Sans","Sarabun","Leelawadee UI","Thonburi",system-ui,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#stage{position:relative;width:1080px;height:1920px;background:var(--panel);overflow:hidden}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;background:var(--panel)}

/* ---------- shared chrome for feature scenes ---------- */
.chrome{position:absolute;top:0;left:0;right:0;padding:84px 72px 0}
.brandrow{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:18px}
.brand .bicon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--red),var(--magenta));display:flex;align-items:center;justify-content:center}
.brand .bname{font-size:30px;font-weight:700;letter-spacing:.01em}
.scnum{font-size:30px;font-weight:600;color:#8A8A93;font-family:"Noto Sans",sans-serif}
.scnum b{color:var(--magenta);font-weight:800}
.titleblock{margin-top:52px}
.t-th{font-size:66px;font-weight:800;line-height:1.25;white-space:nowrap}
.t-en{margin-top:10px;font-size:27px;font-weight:700;letter-spacing:.14em;color:#8A8A93;font-family:"Noto Sans",sans-serif}
.beatrow{margin-top:34px;height:64px;position:relative}
.beat{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:14px;height:64px;padding:0 30px;border-radius:32px;color:#fff;font-size:31px;font-weight:700}
.beat .bdot{width:14px;height:14px;border-radius:50%;background:#fff}
.beat.b1{background:var(--red)}
.beat.b2{background:var(--blue)}
.beat.b3{background:var(--safe)}

.simchip{position:absolute;top:350px;right:72px;background:#FFF4E5;border:2px solid #F0B26B;color:#8A5312;
  font-size:28px;font-weight:700;padding:12px 26px;border-radius:14px}
.androidnote{position:absolute;left:16px;right:16px;bottom:16px;background:#B42318;color:#fff;z-index:80;
  font-size:25px;font-weight:700;text-align:center;padding:16px 0;border-radius:0 0 58px 58px}

.phonewrap{position:absolute;left:50%;top:472px;transform:translateX(-50%)}
.phone{position:relative;width:534px;height:1064px;background:#0E0E12;border-radius:74px;padding:16px;
  box-shadow:0 44px 90px rgba(20,20,22,.20),0 10px 28px rgba(20,20,22,.14)}
.screen{position:relative;width:100%;height:100%;border-radius:58px;overflow:hidden;background:#fff}
.notch{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:150px;height:36px;background:#0E0E12;border-radius:20px;z-index:60}
.statusbar{height:78px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 34px 8px;font-size:24px;font-weight:600;font-family:"Noto Sans",sans-serif}
.statusbar .sr{display:flex;gap:10px;align-items:center}

/* caption + sticky */
.caption{position:absolute;left:72px;right:72px;top:1592px;text-align:center}
.cap-line{font-size:47px;font-weight:700;line-height:1.45;min-height:70px}
.sticky{position:absolute;left:72px;right:72px;top:1756px;text-align:center}
.sticky .in{display:inline-block;background:#fff;border:2px solid var(--rule);border-radius:18px;
  padding:16px 34px;font-size:31px;font-weight:600;color:#55555E;line-height:1.5}
.footnote{position:absolute;left:72px;right:72px;top:1866px;text-align:center;font-size:23px;color:#8A8A93;font-weight:500}

/* feature freeze card */
.fcard{position:absolute;left:50%;top:1180px;width:820px;margin-left:-410px;background:#fff;border-radius:34px;
  padding:40px 46px;box-shadow:0 30px 70px rgba(20,20,22,.22);display:flex;align-items:center;gap:34px}
.fcard .fic{flex:0 0 108px;width:108px;height:108px;border-radius:28px;background:linear-gradient(135deg,var(--red),var(--magenta));
  display:flex;align-items:center;justify-content:center}
.fcard .fth{font-size:43px;font-weight:800;line-height:1.3}
.fcard .fen{margin-top:6px;font-size:24px;font-weight:700;letter-spacing:.12em;color:#8A8A93;font-family:"Noto Sans",sans-serif}
.fcard .fok{margin-top:10px;font-size:29px;font-weight:700;color:var(--safe);display:flex;align-items:center;gap:10px}

/* progress bar */
#progress{position:absolute;left:0;right:0;bottom:0;height:10px;background:rgba(20,20,22,.08);z-index:999}
#progress .fill{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--magenta))}

/* ---------- IN scene ---------- */
#sc-in{background:linear-gradient(160deg,#C4006B 0%,var(--magenta) 34%,var(--red) 100%);color:#fff}
#sc-in .inwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
#sc-in .shield{margin-top:470px;width:300px;height:300px;position:relative;z-index:5}
#sc-in .ring{position:absolute;left:50%;top:470px;width:300px;height:300px;margin-left:-150px;border-radius:50%;
  border:3px solid rgba(255,255,255,.5)}
#sc-in .orb{position:absolute;left:50%;top:470px;width:118px;height:118px;margin:91px 0 0 -59px;border-radius:32px;
  background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.38);display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(2px)}
#sc-in .in-name{margin-top:280px;font-size:44px;font-weight:600;letter-spacing:.02em;opacity:.92}
#sc-in .in-head{margin-top:18px;font-size:84px;font-weight:800;line-height:1.3;text-align:center}
#sc-in .in-chip{margin-top:44px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.5);
  padding:18px 44px;border-radius:44px;font-size:37px;font-weight:700}
#sc-in .in-vo{position:absolute;left:90px;right:90px;top:1660px;text-align:center;font-size:41px;font-weight:600;line-height:1.5;opacity:.95}

/* ---------- OUT scene ---------- */
#sc-out{background:#fff}
#sc-out .o-head{position:absolute;top:120px;left:0;right:0;text-align:center;font-size:76px;font-weight:800}
#sc-out .o-sub{position:absolute;top:238px;left:0;right:0;text-align:center;font-size:33px;font-weight:600;color:#8A8A93}
#sc-out .steps{position:absolute;top:360px;left:110px;right:110px;display:flex;flex-direction:column;gap:36px}
.stepcard{background:var(--panel);border:2px solid var(--rule);border-radius:32px;padding:40px 46px;display:flex;gap:36px;align-items:center}
.stepcard .n{flex:0 0 84px;width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--magenta));
  color:#fff;font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans",sans-serif}
.stepcard .s-t{font-size:41px;font-weight:800;line-height:1.35}
.stepcard .s-d{margin-top:8px;font-size:31px;font-weight:500;color:#55555E;line-height:1.5}
.stepcard .ussd{display:inline-block;margin-top:14px;background:var(--ink);color:#fff;font-family:"Noto Sans",monospace;
  font-size:47px;font-weight:800;letter-spacing:.06em;padding:14px 34px;border-radius:18px}
#sc-out .o-price{position:absolute;top:1215px;left:0;right:0;text-align:center;font-size:47px;font-weight:800}
#sc-out .o-price small{font-size:31px;font-weight:600;color:#55555E}
#sc-out .o-close{position:absolute;top:1330px;left:100px;right:100px;text-align:center;font-size:42px;font-weight:800;line-height:1.5}
#sc-out .o-close .grad{background:linear-gradient(90deg,var(--red),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
#sc-out .o-vo{position:absolute;top:1580px;left:90px;right:90px;text-align:center;font-size:37px;font-weight:600;color:#55555E;line-height:1.55}
#sc-out .o-fine{position:absolute;top:1790px;left:70px;right:70px;text-align:center;font-size:25px;font-weight:500;color:#8A8A93;line-height:1.6}

/* ---------- generic in-phone building blocks ---------- */
.apphead{display:flex;align-items:center;gap:16px;padding:16px 30px 18px;border-bottom:2px solid var(--rule)}
.apphead .ah-t{font-size:31px;font-weight:700}
.apphead .ah-s{font-size:22px;color:#8A8A93;font-weight:500}
.listrow{display:flex;align-items:center;gap:20px;padding:24px 30px;border-bottom:2px solid #EFEFF3}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:6px 16px;font-size:22px;font-weight:700}
.togglerow{display:flex;align-items:center;justify-content:space-between;padding:26px 30px;border-bottom:2px solid #EFEFF3}
.tglab{font-size:27px;font-weight:600}
.toggle{width:78px;height:44px;border-radius:22px;background:#D3D3DA;position:relative;transition:none}
.toggle .knob{position:absolute;top:4px;left:4px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.toggle.on{background:var(--safe)}
.toggle.on .knob{left:38px}
.appbtn{display:flex;align-items:center;justify-content:center;border-radius:20px;font-weight:700;text-align:center}

/* S01 call screen */
.callscr{position:absolute;inset:0;background:linear-gradient(180deg,#1B1B26,#0E0E14);color:#fff}
.callscr .cs-inc{margin-top:120px;text-align:center;font-size:26px;color:#B9B9C6;font-weight:500}
.callscr .avatar{margin:34px auto 0;width:170px;height:170px;border-radius:50%;background:#2A2A38;
  display:flex;align-items:center;justify-content:center;font-size:74px;font-weight:700;color:#8A8A99;position:relative}
.callscr .av-ring{position:absolute;inset:-16px;border-radius:50%;border:3px solid rgba(255,255,255,.28)}
.callscr .cs-num{margin-top:36px;text-align:center;font-size:52px;font-weight:700;font-family:"Noto Sans",sans-serif;letter-spacing:.02em}
.callscr .cs-lab{margin-top:12px;text-align:center;font-size:27px;color:#B9B9C6}
.callscr .cs-actions{position:absolute;bottom:70px;left:0;right:0;display:flex;justify-content:space-evenly}
.callscr .cbtn{width:132px;height:132px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.callscr .dec{background:#E5484D}
.callscr .acc{background:#30A46C}
.warncard{position:absolute;left:22px;right:22px;top:560px;background:#fff;border-radius:30px;padding:30px 32px;color:var(--ink);
  border-left:14px solid var(--red);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.warncard .wc-head{display:flex;align-items:center;gap:14px;font-size:27px;font-weight:800}
.warncard .wc-body{margin-top:14px;font-size:29px;line-height:1.5;font-weight:600}
.warncard .wc-tag{margin-top:16px}
.callscr .ended{position:absolute;left:0;right:0;top:400px;text-align:center;font-size:41px;font-weight:700;color:#FF8589}

/* S02 sms */
.smsscr{position:absolute;inset:0;background:#fff}
.bubble{margin:26px 26px 0;background:#F0F0F5;border-radius:28px;border-top-left-radius:8px;padding:26px 28px;max-width:420px;position:relative}
.bubble .bb-t{font-size:28px;line-height:1.55;font-weight:500}
.bubble .bb-link{margin-top:14px;font-size:26px;color:var(--blue);text-decoration:underline;font-weight:600;word-break:break-all}
.bubble.blocked .bb-link{color:#9A9AA5;text-decoration:line-through}
.smstag{position:absolute;top:-24px;right:-10px;background:var(--red);color:#fff;font-size:24px;font-weight:800;
  padding:10px 20px;border-radius:14px;box-shadow:0 10px 24px rgba(229,0,125,.35);display:flex;gap:8px;align-items:center}
.linkblock{margin:18px 26px 0;display:flex;align-items:center;gap:12px;background:#FDECEC;border:2px solid #F3A6A6;
  color:#B42318;font-size:26px;font-weight:700;border-radius:16px;padding:14px 22px;width:fit-content}
.tapfail{position:absolute;left:0;right:0;top:760px;text-align:center;font-size:34px;font-weight:800;color:#B42318}

/* S03 block form */
.blockscr{position:absolute;inset:0;background:#fff}
.callogrow .ic{width:64px;height:64px;border-radius:50%;background:#F0F0F5;display:flex;align-items:center;justify-content:center}
.formbox{margin:26px;background:var(--panel);border-radius:26px;padding:30px}
.formbox .fb-l{font-size:24px;font-weight:700;color:#55555E}
.forminput{margin-top:14px;background:#fff;border:2px solid var(--rule);border-radius:16px;height:84px;display:flex;align-items:center;
  padding:0 24px;font-size:34px;font-weight:700;font-family:"Noto Sans",sans-serif}
.forminput .caret{width:3px;height:44px;background:var(--magenta);margin-left:6px}
.reasons{display:flex;gap:14px;margin-top:22px}
.rchip{border:2px solid var(--rule);background:#fff;border-radius:30px;padding:8px 18px;font-size:21px;font-weight:700;color:#55555E}
.rchip.sel{background:var(--magenta);border-color:var(--magenta);color:#fff}
.addbtn{margin-top:26px;height:88px;background:linear-gradient(90deg,var(--red),var(--magenta));color:#fff;font-size:31px}
.toast{position:absolute;left:26px;right:26px;bottom:360px;background:var(--ink);color:#fff;font-size:26px;font-weight:600;
  border-radius:20px;padding:22px 28px;display:flex;align-items:center;gap:14px;box-shadow:0 16px 40px rgba(0,0,0,.3)}

/* S04 web */
.webscr{position:absolute;inset:0;background:#fff}
.feedcard{margin:20px 24px;background:#fff;border:2px solid var(--rule);border-radius:22px;overflow:hidden}
.feedhead{display:flex;gap:16px;align-items:center;padding:18px 22px}
.feedhead .flogo{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#B9B9C6,#8A8A99);filter:blur(6px)}
.feedhead .fn{font-size:25px;font-weight:700;filter:blur(5px)}
.feedhead .fs{font-size:20px;color:#8A8A93;margin-top:4px}
.adbody{padding:0 22px 20px;font-size:27px;line-height:1.5;font-weight:600}
.adimg{height:250px;background:linear-gradient(135deg,#3E5C9A,#2E6FD9);display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:37px;font-weight:800;letter-spacing:.02em}
.adcta{margin:18px 22px 22px;height:74px;border:2px solid var(--rule);border-radius:14px;font-size:26px;color:#55555E}
.urlbar{margin:18px 20px 0;display:flex;align-items:center;gap:10px;background:#F0F0F5;border-radius:26px;height:76px;padding:0 22px;
  font-size:22px;font-weight:600;font-family:"Noto Sans",sans-serif;color:#55555E;white-space:nowrap;overflow:hidden}
.urlbar .ns{color:#B42318;font-weight:800}
.blockpage{position:absolute;left:0;right:0;bottom:0;top:120px;background:linear-gradient(180deg,#C22026,#8F1418);color:#fff;display:flex;
  flex-direction:column;align-items:center;text-align:center;padding:0 40px}
.blockpage .bp-ic{margin-top:120px}
.blockpage .bp-t{margin-top:40px;font-size:66px;font-weight:800}
.blockpage .bp-e{margin-top:6px;font-size:30px;font-weight:700;letter-spacing:.2em;font-family:"Noto Sans",sans-serif;opacity:.85}
.blockpage .bp-d{margin-top:36px;font-size:31px;line-height:1.6;font-weight:500;opacity:.95}
.blockpage .bp-b{margin-top:56px;background:#fff;color:#8F1418;border-radius:18px;padding:20px 46px;font-size:29px;font-weight:800}

/* S05 scan */
.scanscr{position:absolute;inset:0;background:#fff}
.mailrow{padding:22px 28px;border-bottom:2px solid #EFEFF3}
.mailrow .m-f{font-size:26px;font-weight:700}
.mailrow .m-s{font-size:25px;color:#55555E;margin-top:6px;font-weight:500}
.attach{margin-top:14px;display:inline-flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--rule);
  border-radius:14px;padding:12px 20px;font-size:24px;font-weight:700;font-family:"Noto Sans",sans-serif}
.scanring{margin:30px auto 0;width:300px;height:300px;position:relative}
.scanring svg{transform:rotate(-90deg)}
.scanring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scanring .pv{font-size:64px;font-weight:800;font-family:"Noto Sans",sans-serif}
.scanring .pl{font-size:24px;color:#55555E;font-weight:600}
.scanstat{text-align:center;margin-top:22px;font-size:28px;font-weight:600;color:#55555E}
.scanres{margin:24px 26px 0;border-radius:22px;overflow:hidden;border:2px solid var(--rule)}
.scanres .sr-h{display:flex;justify-content:space-evenly;background:var(--panel);padding:20px 0}
.scanres .sr-h b{font-size:37px;font-family:"Noto Sans",sans-serif}
.scanres .sr-h div{text-align:center;font-size:23px;color:#55555E;font-weight:600}
.badrow{display:flex;align-items:center;gap:18px;padding:22px 24px;background:#FDECEC}
.badrow .b-n{font-size:26px;font-weight:800;font-family:"Noto Sans",sans-serif}
.badrow .b-d{font-size:23px;color:#B42318;font-weight:600;margin-top:4px}
.delbtn{margin-left:auto;background:#B42318;color:#fff;border-radius:14px;padding:12px 22px;font-size:24px;font-weight:800}
.deldone{position:absolute;left:0;right:0;top:880px;text-align:center;font-size:34px;font-weight:800;color:var(--safe)}

/* S06 wifi */
.wifiscr{position:absolute;inset:0;background:#fff}
.wifirow .wname{font-size:29px;font-weight:700;font-family:"Noto Sans",sans-serif}
.wifirow .wsub{font-size:23px;color:#8A8A93;margin-top:4px;font-weight:500}
.wifibanner{position:absolute;left:18px;right:18px;top:96px;background:var(--ink);color:#fff;border-radius:24px;padding:24px 26px;
  box-shadow:0 24px 60px rgba(0,0,0,.35);display:flex;gap:18px;align-items:flex-start}
.wifibanner .wb-t{font-size:25px;font-weight:800}
.wifibanner .wb-d{font-size:25px;line-height:1.5;margin-top:8px;font-weight:500}
.wifipanel{position:absolute;left:0;right:0;bottom:0;top:420px;background:var(--panel);border-top-left-radius:36px;border-top-right-radius:36px;padding-top:10px}
.wifipanel .wp-h{padding:24px 30px 10px;font-size:31px;font-weight:800}

/* S07 password */
.pwscr{position:absolute;inset:0;background:#fff}
.notecard{margin:24px;background:#FFF8DC;border-radius:20px;padding:28px;border:2px solid #EFE3B0}
.notecard .n-t{font-size:29px;font-weight:800}
.notecard .n-l{font-size:27px;margin-top:16px;font-weight:500;color:#55555E}
.notecard .n-l b{font-family:"Noto Sans",sans-serif;color:var(--ink)}
.pwvault{margin:24px;background:var(--panel);border-radius:26px;padding:30px}
.pwvault .v-site{display:flex;align-items:center;gap:18px}
.pwvault .v-ic{width:76px;height:76px;border-radius:20px;background:#fff;border:2px solid var(--rule);display:flex;align-items:center;justify-content:center}
.pwvault .v-d{font-size:29px;font-weight:800;font-family:"Noto Sans",sans-serif}
.pwvault .v-u{font-size:24px;color:#55555E;font-weight:600;margin-top:4px;font-family:"Noto Sans",sans-serif}
.pwfield{margin-top:24px;background:#fff;border:2px solid var(--rule);border-radius:16px;height:84px;display:flex;align-items:center;
  padding:0 24px;font-size:26px;font-weight:700;font-family:"Noto Sans",monospace;white-space:nowrap;overflow:hidden}
.genbtn{margin-top:22px;height:80px;background:#fff;border:2px solid var(--magenta);color:var(--magenta);font-size:27px}
.savebtn{margin-top:16px;height:88px;background:linear-gradient(90deg,var(--red),var(--magenta));color:#fff;font-size:29px}
.pwsafe{position:absolute;left:0;right:0;top:900px;text-align:center}
.pwsafe .ps-t{margin-top:18px;font-size:31px;font-weight:800;color:var(--safe)}

/* S08 parental */
.kidscr{position:absolute;inset:0;background:#fff}
.profrow{display:flex;gap:22px;padding:16px 30px;border-bottom:2px solid #EFEFF3}
.prof{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:24px;font-weight:700}
.prof .pa{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#fff}
.prof.p1 .pa{background:var(--blue)}
.prof.p2 .pa{background:var(--magenta);outline:5px solid #F8C8DF}
.setrow{display:flex;align-items:center;gap:20px;padding:19px 30px;border-bottom:2px solid #EFEFF3}
.setrow .s-ic{width:64px;height:64px;border-radius:18px;background:var(--panel);display:flex;align-items:center;justify-content:center}
.setrow .s-t{font-size:26px;font-weight:700}
.setrow .s-v{font-size:23px;color:#55555E;font-weight:600;margin-top:4px}

/* ---------- scene chrome builder for feature scenes ---------- */
function featureScene(id,num,total,d){
  const sc=E("section","scene");sc.id="sc-"+id;
  const chrome=E("div","chrome");
  chrome.append(
    (()=>{const r=E("div","brandrow");
      r.append(
        (()=>{const b=E("div","brand");
          b.append(E("div","bicon",svg("shield",34,"#fff",2.2)),E("div","bname",T.brand));return b;})(),
        E("div","scnum",`<b>${num}</b> / ${total}`)
      );return r;})(),
    (()=>{const tb=E("div","titleblock");
      tb.append(E("div","t-th",d.th),E("div","t-en",d.en));return tb;})(),
    (()=>{const br=E("div","beatrow");
      br.append(
        E("div","beat b1",`<span class="bdot"></span>${T.beats.b1}`),
        E("div","beat b2",`<span class="bdot"></span>${T.beats.b2}`),
        E("div","beat b3",`<span class="bdot"></span>${T.beats.b3}`));
      return br;})()
  );
  sc.append(chrome);
  if(d.scam) sc.append(E("div","simchip",T.sim));
  const pw=E("div","phonewrap");
  const phone=E("div","phone");
  const screenEl=E("div","screen");
  phone.append(screenEl,E("div","notch"));
  if(d.android) phone.append(E("div","androidnote","⚠ "+T.androidOnly));
  pw.append(phone);
  sc.append(pw);
  const cap=E("div","caption");cap.append(E("div","cap-line"));sc.append(cap);
  if(d.sticky){const st=E("div","sticky",`<span class="in">${d.sticky}</span>`);sc.append(st);}
  if(d.footnote){sc.append(E("div","footnote",d.footnote));}
  const fc=E("div","fcard");
  fc.append(E("div","fic",svg(d.icon,60,"#fff",2)),
    (()=>{const w=E("div");
      w.append(E("div","fth",d.th),E("div","fen",d.en),
        E("div","fok",`${svg("check",28,"#12A150",3)} ${d.result}`));
      return w;})());
  sc.append(fc);
  stage.append(sc);
  return {sc,screen:screenEl,phone,pw};
}
function statusbar(dark=false,time="09:41"){
  const c=dark?"#fff":"#141416";
  return `<div class="statusbar" style="color:${c}"><span>${time}</span><span class="sr">${svg("wifi",24,c,2.4)} ▮▮▮</span></div>`;
}
/* shared chrome animation (beats, caption, sticky, freeze card) */
function chromeAnim(refs,d,local,D){
  const sc=refs.sc;
  const b1=3, b3s=D-3;
  const q=(s)=>sc.querySelector(s);
  // beat chips
  const chips=[q(".beat.b1"),q(".beat.b2"),q(".beat.b3")];
  const bAct=local<b1?0:(local<b3s?1:2);
  chips.forEach((ch,i)=>{
    const on=i===bAct;
    A(ch,on?1:0,{y:on?0:14});
  });
  // caption text per beat
  const cap=q(".cap-line");
  let txt,capCol;
  if(bAct===0){txt=d.problem;capCol="#B42318";}
  else if(bAct===1){txt=d.vo;capCol="var(--ink)";}
  else {txt=d.result;capCol="var(--safe)";}
  if(cap.textContent!==txt)cap.textContent=txt;
  cap.style.color=capCol;
  const capStart=bAct===0?0.25:(bAct===1?b1:b3s);
  A(cap,seg(local,capStart,0.4),{y:L(16,0,seg(local,capStart,0.4))});
  // persistent text enters early and stays for the whole scene (ข้อความค้างจอ)
  const st=q(".sticky");
  if(st)A(st,seg(local,0.7,0.5),{y:L(20,0,seg(local,0.7,0.5))});
  const fn=q(".footnote");
  if(fn)A(fn,seg(local,0.9,0.5));
  // freeze card at beat3
  const fc=q(".fcard");
  const p=seg(local,b3s,0.55,back);
  A(fc,seg(local,b3s,0.3),{y:L(120,0,p),s:L(0.92,1,p)});
  // title entrance
  const tb=q(".titleblock");
  A(tb,seg(local,0.05,0.5),{y:L(20,0,seg(local,0.05,0.5))});
  // phone entrance
  A(refs.pw,seg(local,0.1,0.6),{x:-267,y:L(60,0,seg(local,0.1,0.6))});
  refs.pw.style.left="50%";
  // sim chip pulse subtly
  const sim=sc.querySelector(".simchip");
  if(sim)A(sim,1);
  const an=sc.querySelector(".androidnote");
  if(an)A(an,1);
  return {b1,b3s,bAct};
}

/* ============================================================ SEEK */
const sceneEls=SCENES.map(s=>({...s,el:document.getElementById("sc-"+s.id)}));
window.TOTAL=TOTAL;
window.SCENES=SCENES;
window.seek=function(t){
  t=Math.max(0,Math.min(TOTAL,t));
  sceneEls.forEach((s,i)=>{
    const el=s.el;
    const D=s.end-s.start;
    const visible=t>=s.start-0.05&&t<=s.end+FADE+0.05;
    if(!visible){sh(el,0);return;}
    el.style.zIndex=10+i;
    const aIn=i===0?1:seg(t,s.start,FADE);
    const alpha=t>s.end+FADE?0:aIn;
    sh(el,alpha);
    const local=Math.max(0,Math.min(D,t-s.start));
    if(el._anim)el._anim.call(el,local,D);
    if(!el._anim&&el.__animFn)el.__animFn(local,D);
  });
  prog.querySelector(".fill").style.width=(t/TOTAL*100)+"%";
};
/* scene anim fns were attached as sc._anim */
sceneEls.forEach(s=>{s.el._anim=s.el._anim||null;});

/* fit long Thai titles to one line (after fonts load) */
document.fonts.ready.then(()=>{
  document.querySelectorAll(".t-th").forEach(el=>{
    let fs=66;
    while(el.scrollWidth>el.clientWidth&&fs>42){fs-=2;el.style.fontSize=fs+"px";}
  });
});

/* preview mode: open index.html#play in a browser */
if(location.hash==="#play"){
  const t0=performance.now();
  (function loop(){
    const t=((performance.now()-t0)/1000)%TOTAL;
    window.seek(t);
    requestAnimationFrame(loop);
  })();
}else{
  window.seek(0);
}
